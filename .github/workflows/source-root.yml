name: source-root
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  candidate-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r ci/source_root_requirements.txt
      - name: Import only the pinned public key into an isolated keyring
        run: |
          export GNUPGHOME="$RUNNER_TEMP/source-root-public-gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          gpg --batch --import governance/sources/keys/steward-public.asc
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
      - name: Verify bytes, schema, graphs, boundaries and signed historical Canon
        run: python scripts/validate_source_root.py
      - name: Synthetic regression and fail-closed tests
        run: python -m unittest discover -s tests -p 'test_source_root.py' -v
